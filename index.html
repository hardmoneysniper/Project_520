<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕给小赵雨，520快乐！</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section id="hero">
    <div id="petals"></div>
    <div class="hero-num">520</div>
    <div class="hero-name">宝宝我爱你!</div>
    <div class="hero-pill">在一起的第 <span class="hero-hl">120</span> 天！</div>
    <div class="down-arrow">
        向下滑动
        <svg width="22" height="14" viewBox="0 0 22 14" fill="none">
            <path d="M2 2L11 11L20 2" stroke="rgba(255,255,255,1)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>
</section>

<section id="memories">
    <div class="sec-head">
        <h2>我们的回忆</h2>
        <div class="sec-deco">
            <div class="deco-line"></div>
            <span style="font-size:20px;color:#e8758a">💕</span>
            <div class="deco-line r"></div>
        </div>
    </div>
    <div class="tl">
        <div class="tl-spine"></div>
        <div id="tlItems"></div>
    </div>
</section>

<section id="love">
    <div class="love-inner">
        <div class="love-h">我爱赵雨的点</div>
        <div class="love-sub">每一点都是真心话</div>
    </div>
</section>

<section id="collage">
    <div class="collage-wrap">
        <div id="photoGrid"></div>
    </div>
    <div class="collage-end">
        <div class="collage-big">宝宝520快乐！</div>
    </div>
</section>

<script src="script.js"></script>
</body>
</html>
